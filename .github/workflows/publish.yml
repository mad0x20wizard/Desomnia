name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write


env:
  name: 'Desomnia'

  VERSION_NET: '10.0'
  VERSION_DESOMNIA: ${{ github.ref_name }}

  # Attach the .deb/.rpm packages as downloadable assets to the GitHub Release. Disabled:
  # they cluttered the Releases page, and users should install them from the package
  # repository (see release-cloudsmith) instead. Set to true to re-attach them.
  ATTACH_PACKAGES: false

jobs:

  build-plugins:
    name: Build Desomnia plugin
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # name: [ FirewallKnockOperator ]
        name: [ DuoStreamIntegration, HyperVSupport, FirewallKnockOperator, FRITZBoxRouter ]

        include:
          - name: DuoStreamIntegration
            os: -windows8.0
          - name: HyperVSupport
            os: -windows8.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{ env.VERSION_NET }}.x'

      - name: Publish ${{ matrix.name }}
        run: |
          dotnet publish plugins/${{ matrix.name }}/${{ matrix.name }}.csproj \
            -o ${{ runner.temp }}/publish/${{ matrix.name }} \
            -f net${{ env.VERSION_NET }}${{ matrix.os }} \
            -c Release \
            --no-self-contained \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:PublishSingleFile=false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.name }}
          path:  ${{ runner.temp }}/publish/
          if-no-files-found: error

  build-linux:
    name: Build DesomniaDaemon
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [ arm, arm64, x64 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{ env.VERSION_NET }}.x'
          
      - name: Publish DesomniaDaemon (${{ matrix.arch }})
        run: |
          dotnet publish DesomniaDaemon/DesomniaDaemon.csproj \
            -o ${{ runner.temp }}/publish \
            -f net${{ env.VERSION_NET }} \
            -c Release \
            -r linux-${{ matrix.arch }} \
            --no-self-contained \
            -p:DebugSymbols=false \
            -p:PublishSingleFile=true \
            -p:PublishReadyToRun=true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path:  ${{ runner.temp }}/publish/desomniad
          if-no-files-found: error

  build-linux-native:
    name: Build DesomniaDaemon AOT
    # NativeAOT emits native machine code and links against the BUILD machine's glibc; it cannot
    # cross-compile like the framework-dependent ReadyToRun build. Two consequences drive the runner choice:
    #   * Each target must be built on a runner of its own architecture (arm64 on an arm64 runner,
    #     x64 on an x64 runner) -- there is no cross-arch AOT.
    #   * The binary requires glibc >= the build glibc, and glibc is forward-incompatible. The
    #     ubuntu-24.04(-arm) runners ship glibc 2.39 -- too new for Raspberry Pi OS. .NET 10 ships no
    #     Debian container image (its default sdk:10.0 is Ubuntu 24.04 / glibc 2.39), and a static musl
    #     build is a dead end here because a fully-static binary can't dlopen the glibc libpcap SharpPcap
    #     needs at runtime. So we build on the ubuntu-22.04(-arm) runners (glibc 2.35): the binaries then
    #     run on Debian 12 "Bookworm" (glibc 2.36) and newer.
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          # 32-bit arm (armhf) is intentionally omitted: NativeAOT armhf is experimental and there is
          # no native armhf runner. arm64 and x64 cover the always-on SBCs and servers where the memory
          # win matters; they are also the two architectures the deb/rpm packages ship (build-linux-packages).
          - arch: arm64
            runner: ubuntu-22.04-arm   # glibc 2.35 -> binary runs on glibc >= 2.35 (Bookworm = 2.36)
          - arch: x64
            runner: ubuntu-22.04       # glibc 2.35 -> same floor for amd64 targets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{ env.VERSION_NET }}.x'

      # binutils (objcopy, for StripSymbols) ships with the runner image; only clang + zlib headers are missing.
      - name: Install NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish DesomniaDaemon AOT (${{ matrix.arch }})
        # -p:PublishAot=true is a global property, so it also defines DESOMNIA_AOT and activates the
        # AOT-only settings baked into DesomniaDaemon.csproj (GC hard limit, size-optimized ILC,
        # statically-linked plugins: FirewallKnockOperator, FRITZBoxRouter). The output is a single self-contained native binary;
        # PublishSingleFile / PublishReadyToRun / --no-self-contained do not apply to an AOT build.
        run: |
          dotnet publish DesomniaDaemon/DesomniaDaemon.csproj \
            -o ${{ runner.temp }}/publish \
            -f net${{ env.VERSION_NET }} \
            -c Release \
            -r linux-${{ matrix.arch }} \
            -p:PublishAot=true \
            -p:StripSymbols=true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          # "-native" suffix -> release job zips this as Desomnia_<ver>_linux-<arch>-native.zip,
          # and build-linux-packages turns it into the deb/rpm payload.
          name: linux-${{ matrix.arch }}-native
          path:  ${{ runner.temp }}/publish/desomniad
          if-no-files-found: error

  build-linux-packages:
    name: Build deb/rpm packages
    # Reuses the AOT binaries from build-linux-native as the package payload -- no rebuild. The
    # packages ship the native build deliberately: it needs no .NET runtime and is the low-memory,
    # server-oriented flavour. Users who need runtime plugins or local sleep management install via
    # the archive, Homebrew or Docker instead. nfpm derives both deb and rpm from one config.
    runs-on: ubuntu-latest
    needs: [ build-linux-native ]

    strategy:
      matrix:
        include:
          - arch: arm64
            goarch: arm64   # nfpm -> deb "arm64",  rpm "aarch64"
          - arch: x64
            goarch: amd64   # nfpm -> deb "amd64",  rpm "x86_64"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download native daemon (${{ matrix.arch }})
        uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-native
          path: ${{ runner.temp }}/payload

      - name: Install nfpm
        # Tracks the latest nfpm release (v2 config format is stable). Pin the tag for reproducibility.
        run: |
          NFPM_VERSION="$(curl -fsSL https://api.github.com/repos/goreleaser/nfpm/releases/latest | jq -r .tag_name)"
          NFPM_VERSION="${NFPM_VERSION#v}"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb" -o "${{ runner.temp }}/nfpm.deb"
          sudo apt-get install -y "${{ runner.temp }}/nfpm.deb"

      - name: Build .deb and .rpm (${{ matrix.arch }})
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${{ env.VERSION_DESOMNIA }}"
          export VERSION="${VERSION#v}"
          export PAYLOAD="${{ runner.temp }}/payload/desomniad"
          chmod +x "$PAYLOAD"
          mkdir -p "${{ runner.temp }}/packages"
          # nfpm does not expand ${...} in the config, so render the placeholders ourselves first.
          # The explicit var list keeps envsubst from touching anything else in the file. The rendered
          # file is written to the repo root (the working dir) so the relative contents `src` paths
          # (packaging/*, LICENSE.txt) still resolve.
          envsubst '${GOARCH} ${VERSION} ${PAYLOAD}' < packaging/nfpm.yaml > nfpm.rendered.yaml
          # Name the output files like the release archives (Desomnia_<ver>_linux-<arch>-native.<ext>)
          # by giving nfpm a full target path. This only renames the file; the package's internal
          # version (3.1.0~alpha17-1) and Architecture metadata (amd64/aarch64) are unaffected.
          BASENAME="Desomnia_${VERSION}_linux-${{ matrix.arch }}-native"
          nfpm package -f nfpm.rendered.yaml -p deb -t "${{ runner.temp }}/packages/${BASENAME}.deb"
          nfpm package -f nfpm.rendered.yaml -p rpm -t "${{ runner.temp }}/packages/${BASENAME}.rpm"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path:  ${{ runner.temp }}/packages/
          if-no-files-found: error

  build-linux-docker:
    name: Build Docker image
    runs-on: ${{ matrix.runner }}
    needs: [ build-plugins, build-linux ]

    strategy:
      matrix:
        platform: [ linux/amd64, linux/arm64, linux/arm/v7 ]

        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: x64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - platform: linux/arm/v7
            runner: ubuntu-24.04
            arch: arm

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}

      - name: Download plugins
        # Only the platform-independent plugins; the -windows8.0 ones can't load on Linux.
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-FirewallKnockOperator
          path: ${{ runner.temp }}/context/plugins
          merge-multiple: true
      - name: Download plugins (FRITZBoxRouter)
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-FRITZBoxRouter
          path: ${{ runner.temp }}/context/plugins
          merge-multiple: true
      - name: Download daemon
        uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/context
          merge-multiple: true

      - name: Stage default configuration
        # The Dockerfile COPYs monitor.xml from the build context root; the context is runner.temp/context,
        # not the repo, so the default config has to be placed there explicitly. In the repo the file is
        # named monitor-proxy.xml (to set it apart from the monitor-host.xml variant); it is staged under
        # its runtime name here.
        run: cp packaging/defaults/monitor-proxy.xml ${{ runner.temp }}/context/monitor.xml

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          file: ./packaging/Dockerfile
          target: standard   # the framework-dependent, multi-arch, plugin-capable flavour
          context: ${{ runner.temp }}/context
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ vars.DOCKERHUB_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-linux-docker:
    name: Create Docker manifest list
    runs-on: ubuntu-latest
    needs: [ build-linux-docker ]

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ vars.DOCKERHUB_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ vars.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.version }}

  build-linux-native-docker:
    name: Build native Docker image
    # The native image is published for linux-arm64 only (the NativeAOT daemon itself also exists for
    # x64, but the image targets the SBC/proxy use case), so this is a single-arch image -- no
    # push-by-digest / manifest-merge dance is needed; we build and push the tags directly. Built
    # natively on an arm64 runner. The image reuses the same `linux-arm64-native` binary the release
    # artifact ships.
    runs-on: ubuntu-24.04-arm
    needs: [ build-linux-native ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download native daemon
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-native
          path: ${{ runner.temp }}/context

      - name: Stage default configuration
        # See the note in build-linux-docker: the Dockerfile COPYs monitor.xml from the context root;
        # the repo file monitor-proxy.xml is staged under its runtime name.
        run: cp packaging/defaults/monitor-proxy.xml ${{ runner.temp }}/context/monitor.xml

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          # Same tag set as the standard image, with a "-native" suffix on every tag
          # (e.g. :3.0.0-beta2 -> :3.0.0-beta2-native, :latest -> :latest-native).
          flavor: |
            suffix=-native,onlatest=true
          tags: |
            type=raw,value=latest
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}

      - name: Build and push (native, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          file: ./packaging/Dockerfile
          target: native
          context: ${{ runner.temp }}/context
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ fromJSON(steps.meta.outputs.json).tags[0] }}

  build-windows:
    name: Build DesomniaService
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [ arm64, x64 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{ env.VERSION_NET }}.x'
          
      - name: Publish DesomniaService (${{ matrix.arch }})
        run: |
          dotnet publish DesomniaService/DesomniaService.csproj \
            -o ${{ runner.temp }}/publish \
            -f net${{ env.VERSION_NET }}-windows8.0 \
            -c Release \
            -r win-${{ matrix.arch }} \
            --no-self-contained \
            -p:DebugSymbols=false \
            -p:PublishSingleFile=false

      - name: Publish DesomniaServiceHelper (${{ matrix.arch }})
        run: |
          dotnet publish helper/DesomniaServiceHelper/DesomniaServiceHelper.csproj \
            -o ${{ runner.temp }}/publish \
            -f net${{ env.VERSION_NET }}-windows8.0 \
            -c Release \
            -r win-${{ matrix.arch }} \
            --no-self-contained \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:PublishSingleFile=true \
            -p:PublishReadyToRun=true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-${{ matrix.arch }}
          path:  ${{ runner.temp }}/publish/
          if-no-files-found: error

  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    needs: [ build-plugins, build-windows ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{ env.VERSION_NET }}.x'

      - name: Install InnoSetup
        run: choco install innosetup --no-progress -y
        # Chocolatey package: InnoSetup :contentReference[oaicite:0]{index=0}

      - name: Download plugins
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: installer\build\components\plugins
          merge-multiple: true
      - name: Download service (x64)
        uses: actions/download-artifact@v4
        with:
          name: win-x64
          path: installer\build\components\service\x64
      - name: Download service (arm64)
        uses: actions/download-artifact@v4
        with:
          name: win-arm64
          path: installer\build\components\service\arm64

      - name: Build installer (ISCC)
        shell: pwsh
        run: |
          $VERSION = "${{ env.VERSION_DESOMNIA }}" -replace '^v',''
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\setup.iss" `
            "/DMyAppVersion=$VERSION" `
            "/DDisableBridge" `
            "/O${{ runner.temp }}\installer"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows_installer
          path:  ${{ runner.temp }}/installer/
          if-no-files-found: error

  release:
    name: Create release
    needs: [ build-windows-installer, build-linux, build-linux-native, build-linux-packages ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows_installer
          path: ${{ runner.temp }}
      - name: Download linux binaries
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: ${{ runner.temp }}/linux
      - name: Download packages
        # Toggled by ATTACH_PACKAGES (see env block). When skipped, the packages/* globs in the
        # release step simply match nothing -- action-gh-release logs a warning and moves on.
        if: env.ATTACH_PACKAGES == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: ${{ runner.temp }}/packages
          merge-multiple: true

      - name: Create linux archives
        shell: bash
        run: |
          VERSION="${{ env.VERSION_DESOMNIA }}"
          VERSION="${VERSION#v}"

          cd ${{ runner.temp }}/linux

          for platform_dir in */; do
            if [ -d "$platform_dir" ]; then
              cd $platform_dir
              zip -r "${{ runner.temp }}/Desomnia_${VERSION}_${platform_dir%/}.zip" .
              cd ..
            fi
          done

      - name: Download plugin artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: ${{ runner.temp }}/plugins
          merge-multiple: true

      - name: Create plugin archives
        shell: bash
        run: |
          VERSION="${{ env.VERSION_DESOMNIA }}"
          VERSION="${VERSION#v}"

          cd ${{ runner.temp }}/plugins

          for plugin_dir in */; do
            if [ -d "$plugin_dir" ]; then
              cd $plugin_dir
              zip -r "${{ runner.temp }}/plugin-${plugin_dir%/}_${VERSION}.zip" .
              cd ..
            fi
          done

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          #generate_release_notes: true
          files: |
            ${{ runner.temp }}/Desomnia_*.*
            ${{ runner.temp }}/plugin-*.zip
            ${{ runner.temp }}/packages/*.deb
            ${{ runner.temp }}/packages/*.rpm

  release-homebrew:
    name: Create Homebrew release
    runs-on: ubuntu-latest

    # Building macOS bottles is expensive, so stable releases always update the Homebrew formula
    # while prereleases only do so on demand: set the repository variable HOMEBREW_PRERELEASE to
    # "true" to include them. An undefined variable evaluates to an empty string, so prereleases
    # are skipped unless the variable exists AND is set to exactly "true".
    if: ${{ ! (contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta')) || vars.HOMEBREW_PRERELEASE == 'true' }}

    steps:
      - name: Update Homebrew formula
        uses: dawidd6/action-homebrew-bump-formula@v10
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          tap: mad0x20wizard/homebrew-tools
          formula: desomnia
          no_fork: true

  release-cloudsmith:
    name: Publish packages to Cloudsmith
    # Uploads the deb/rpm packages to the Cloudsmith-hosted apt/dnf repository, so users can
    # `apt install desomnia` by name and receive updates through their package manager.
    # Cloudsmith generates and GPG-signs the repository metadata server-side, so this job is
    # stateless -- push and done, no repository checkout, keys or serialization needed.
    #
    # Requires: CLOUDSMITH_REPO (repository variable) and CLOUDSMITH_API_KEY (secret).
    runs-on: ubuntu-latest
    needs: [ build-linux-packages ]

    # Only stable releases are published to the repository -- everyone subscribed to it gets
    # them via the regular system upgrade. Pre-releases stay on GitHub Releases (direct
    # download); a separate opt-in prerelease repository can be added later if wanted.
    if: ${{ ! (contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta')) }}

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: ${{ runner.temp }}/incoming
          merge-multiple: true

      - name: Install Cloudsmith CLI
        run: pip install --upgrade cloudsmith-cli

      - name: Push packages
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          REPO="${{ vars.CLOUDSMITH_REPO }}"
          echo "Publishing ${{ github.ref_name }} to $REPO"

          # any-distro/any-version: the AOT packages are self-contained (glibc >= 2.35 is their
          # only floor), so one upload serves every distribution instead of per-distro copies.
          # --republish allows a re-tagged version to overwrite its earlier upload.
          for f in "${{ runner.temp }}"/incoming/*.deb; do
            cloudsmith push deb "$REPO/any-distro/any-version" "$f" --republish
          done
          for f in "${{ runner.temp }}"/incoming/*.rpm; do
            cloudsmith push rpm "$REPO/any-distro/any-version" "$f" --republish
          done

  release-cleanup:
    name: Remove previous pre-releases
    # When a full release is published, delete the pre-release entries it supersedes from the
    # Releases page (e.g. v3.1.0 removes v3.1.0-alpha1..-alphaN and other older prereleases).
    # Only prereleases whose version sorts BELOW the new release are deleted, so an already
    # published alpha of a NEWER version (e.g. v3.2.0-alpha1 while releasing v3.1.1) survives.
    # The git tags are kept: they document history, and the repository is mirrored from an
    # external origin, so a mirror push would resurrect deleted tags anyway.
    runs-on: ubuntu-latest
    needs: [ release ]

    if: ${{ ! (contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta')) }}

    steps:
      - name: Delete superseded pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          CURRENT="${{ github.ref_name }}"
          # Compare dpkg-style: mapping "-alpha"/"-beta" to "~..." makes prereleases sort below
          # their final release under GNU sort -V (which implements the Debian tilde rule).
          current="${CURRENT/-/\~}"

          for tag in $(gh release list --limit 200 --json tagName,isPrerelease \
                         --jq '.[] | select(.isPrerelease) | .tagName'); do
            t="${tag/-/\~}"
            lowest="$(printf '%s\n%s\n' "$t" "$current" | sort -V | head -n1)"
            if [ "$lowest" = "$t" ] && [ "$t" != "$current" ]; then
              echo "Deleting pre-release $tag"
              gh release delete "$tag" --yes
            else
              echo "Keeping $tag (newer than $CURRENT)"
            fi
          done
